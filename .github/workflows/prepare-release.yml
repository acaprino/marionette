name: Prepare release

# Builds the package (marionette-v<version>) when `plugin.version` in source/sources.json changes on main, or on
# manual dispatch, and opens its release pull request: the build goes as the folder marionette/, with the root
# marketplaces and its notes in releases/<tag>.md, to the branch release/<tag>, and the same job opens the pull
# request into main. Merging it publishes the release (release.yml). Run again before the merge, it refreshes
# the same pull request. A version whose tag is published is never built again.
#
# The pull request is opened here and not by a workflow on the push of release/**: a push made with the
# workflow's own GITHUB_TOKEN starts no other workflow. For the same reason the pull request gets no checks of
# its own: the tests, the validation and the source check of this job are its gate. No secret is used. Needs
# "Allow GitHub Actions to create and approve pull requests" (Settings, Actions, General).
# The factory is Muro (acaprino/muro, public) at the ref written in the file MURO_REF.
on:
  push:
    # Compare the two manifest versions directly, including when a large merge changes hundreds of paths.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MANIFEST: source/sources.json
  MURO_REPOSITORY: acaprino/muro

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        name: Check the version and published tags
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
          fi
          python3 .github/scripts/release_version.py

  release:
    needs: plan
    # A dispatch from another branch would put that branch's commits in the release pull request.
    if: needs.plan.outputs.build == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: prepare-release-${{ needs.plan.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      PKG_VERSION: ${{ needs.plan.outputs.version }}
      PKG_TAG: marionette-v${{ needs.plan.outputs.version }}
    steps:
      # checkout keeps the token for the git commands of the last step, the push included.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: muro
        name: Read the pinned Muro ref
        run: echo "ref=$(tr -d '[:space:]' < MURO_REF)" >> "$GITHUB_OUTPUT"
      # The folder is not named muro: that is the name of the Python package inside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.MURO_REPOSITORY }}
          ref: ${{ steps.muro.outputs.ref }}
          path: factory
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Test the release commit
        run: |
          python -m pip install pytest
          MURO_ROOT="$GITHUB_WORKSPACE/factory" python -m pytest -q -rf --tb=short tests
      - name: Validate, check sources and build
        run: |
          python factory/muro_build.py --manifest "$MANIFEST" --validate
          python factory/muro_build.py --manifest "$MANIFEST" --check-sources
          python factory/muro_build.py --manifest "$MANIFEST" --build --out "$RUNNER_TEMP/release"
      - name: Push the release branch and open its pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MURO_ROOT: ${{ github.workspace }}/factory
        run: |
          branch="release/$PKG_TAG"
          provenance="Built from $GITHUB_REPOSITORY@$GITHUB_SHA ($MANIFEST) with $MURO_REPOSITORY@$(git -C "$MURO_ROOT" rev-parse HEAD)."
          # An earlier run may have prepared or published this version while this build was queued.
          published=$(git ls-remote --tags origin "refs/tags/$PKG_TAG")
          if [ -n "$published" ]; then
            echo "$PKG_TAG is already published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          number=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          existing=$(git ls-remote --heads origin "refs/heads/$branch")
          head=${existing%%$'\t'*}
          if [ -n "$head" ] && [ -n "$number" ]; then
            git fetch --no-tags --depth=1 origin "$head"
            if [ "$(git show -s --format=%b "$head")" = "$provenance" ]; then
              echo "Already prepared in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$number" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          git switch -c "$branch"
          rm -rf marionette
          cp -a "$RUNNER_TEMP/release/marionette" marionette
          # The root marketplaces point Claude Code, Codex and Muro's desktop app at marionette/adapters/<harness>,
          # so the repository's address is enough to install it.
          PYTHONPATH="$MURO_ROOT" python -m muro marketplace . marionette
          mkdir -p releases
          notes="docs/releases/$PKG_TAG.md"
          {
            if [ -f "$notes" ]; then cat "$notes"; echo; else printf '# Marionette %s\n\n' "$PKG_VERSION"; fi
            echo "$provenance"
          } > "releases/$PKG_TAG.md"
          # Named paths only: the checkout of Muro and the caches of the test run stay out.
          git add -A marionette releases .claude-plugin .agents
          if git diff --cached --quiet; then
            echo "$PKG_TAG is already on main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Marionette $PKG_VERSION" -m "$provenance"
          git push --force-with-lease="refs/heads/$branch:$head" origin "$branch"
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "releases/$PKG_TAG.md"
          else
            gh pr create --base main --head "$branch" --title "Marionette $PKG_VERSION" --body-file "releases/$PKG_TAG.md"
            number=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          fi
          echo "$branch is in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$number" >> "$GITHUB_STEP_SUMMARY"
