name: Release pull request

# Muro's "Release Marionette" workflow (acaprino/muro) pushes each build to release/marionette-v<version>. This
# opens its pull request into main, or refreshes the description when Muro builds the same version again.
# Merging it publishes the release (release.yml). Needs "Allow GitHub Actions to create and approve pull
# requests" (Settings, Actions, General).
on:
  push:
    branches: ["release/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Open or refresh the pull request
        run: |
          tag="${BRANCH#release/}"
          gh api -H "Accept: application/vnd.github.raw" "repos/$GH_REPO/contents/releases/$tag.md?ref=$GITHUB_SHA" > notes.md
          # --repo also lets gh work without a checkout.
          number=$(gh pr list --repo "$GH_REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GH_REPO" --body-file notes.md
          else
            gh pr create --repo "$GH_REPO" --base main --head "$BRANCH" --title "Marionette ${tag#marionette-v}" \
              --body-file notes.md
          fi
